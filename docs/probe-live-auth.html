<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>live auth probe</title>
<style>
  body { font: 14px/1.5 monospace; margin: 2rem; }
  pre { white-space: pre-wrap; word-break: break-all; }
  .ok { color: #0a7a2f; }
  .err { color: #b00020; }
</style>
</head>
<body>
<pre id="o">running…</pre>
<script>
const o = document.getElementById('o');
const lines = [];
const log = (line) => { lines.push(line); o.textContent = lines.join('\n'); };

const API = 'https://licensing.skyhome.it';
const tests = [
  ['POST /v1/account/login (wrong creds → expect 401 JSON)', '/v1/account/login', { email: 'probe@example.com', password: 'wrong' }],
  ['POST /v1/account/password-reset/request', '/v1/account/password-reset/request', { email: 'probe@example.com' }],
  ['POST /v1/account/claim', '/v1/account/claim', { email: 'probe@example.com', password: 'wrongpass1' }],
];

(async () => {
  log('origin: ' + location.origin + '\n');
  for (const [label, path, body] of tests) {
    const row = '— ' + label + '\n';
    try {
      const res = await fetch(API + path, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body),
      });
      let data = null;
      try { data = await res.json(); } catch (_) { data = 'NON-JSON BODY: ' + (await res.text().catch(() => '?')); }
      log(row + '  status: ' + res.status + '\n  cors-allow-origin: ' + res.headers.get('access-control-allow-origin') + '\n  body: ' + JSON.stringify(data).slice(0, 300) + '\n');
    } catch (err) {
      log(row + '  FETCH FAILED (' + err + ')\n  requestMode? ' + (err && err.message) + '\n');
    }
  }
  document.title = 'done';
})();
</script>
</body>
</html>
