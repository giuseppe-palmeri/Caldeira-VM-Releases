<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sidebar logo theme check</title>
<style>body{font-family:monospace;margin:1rem}</style>
</head>
<body>
<div id="out">…</div>
<script>
const out = document.getElementById('out');
const iframe = document.createElement('iframe');
iframe.style.width = '1440px';
iframe.style.height = '1000px';
document.body.appendChild(iframe);
iframe.onload = async () => {
  try {
    await new Promise((r) => setTimeout(r, 900));
    const doc = iframe.contentDocument;
    const logo = doc.querySelector('.sidebar .sidebar-logo');
    const res = {};
    res.src = logo ? logo.getAttribute('src') : null;
    if (logo) {
      res.lightContent = getComputedStyle(logo, '::before').content || getComputedStyle(logo).content;
      // force dark and re-read
      doc.documentElement.dataset.theme = 'dark';
      await new Promise((r) => setTimeout(r, 200));
      res.darkContent = getComputedStyle(logo).content;
      res.darkContentPseudo = getComputedStyle(logo, '::before').content;
      doc.documentElement.dataset.theme = 'light';
    }
    out.textContent = JSON.stringify(res, null, 2);
    document.title = (res.src && res.src.includes('../caldeira.png')) ? 'ALL OK' : 'FAIL';
  } catch (e) { out.textContent = 'ERRORE: ' + e.message; document.title = 'FAIL'; }
};
iframe.src = '/docs/reference/it/index.html';
</script>
</body>
</html>
