<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nav behavior probe</title>
</head>
<body>
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
const lines = [];
const iframe = document.createElement('iframe');
iframe.style.width = '1440px';
iframe.style.height = '1200px';
iframe.style.border = '0';
document.body.appendChild(iframe);
iframe.onload = async () => {
  try {
    const doc = iframe.contentDocument;
    if (doc.fonts && doc.fonts.ready) await doc.fonts.ready;
    await new Promise((r) => setTimeout(r, 400));

    // 1) Dropdown toggles exist
    const toggles = doc.querySelectorAll('.nav-has-sub .nav-toggle');
    lines.push(`toggles=${toggles.length}`);

    // 2) Click "Learn" toggle → .open + aria-expanded=true
    const learn = doc.querySelector('.nav-has-sub .nav-toggle');
    learn.click();
    await new Promise((r) => setTimeout(r, 60));
    const learnItem = learn.closest('.nav-has-sub');
    const panel = learnItem.querySelector('.nav-sub');
    lines.push(`learn.open=${learnItem.classList.contains('open')} expanded=${learn.getAttribute('aria-expanded')} panelDisplay=${getComputedStyle(panel).display} panelLinks=${panel.querySelectorAll('a').length}`);

    // 3) Escape closes
    doc.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await new Promise((r) => setTimeout(r, 40));
    lines.push(`afterEsc.open=${learnItem.classList.contains('open')} expanded=${learn.getAttribute('aria-expanded')}`);

    // 4) Click outside closes
    const cta = doc.querySelector('.hero-actions a');
    learn.click();
    doc.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    await new Promise((r) => setTimeout(r, 40));
    lines.push(`afterOutside.open=${learnItem.classList.contains('open')}`);

    // 5) Login link URL + label
    const login = doc.querySelector('.btn-login');
    lines.push(`login.href=${login.getAttribute('href')} login.label="${login.textContent.trim()}"`);

    // 6) Translations applied (EN default in headless = en-US locale... check what currentLang resolved to)
    const portal = doc.querySelector('[data-i18n="nav.portal"]');
    lines.push(`portal.label="${portal.textContent.trim()}" portal.href=${portal.getAttribute('href')}`);

    // 7) Company dropdown has portal link
    const comp = doc.querySelectorAll('.nav-has-sub')[3];
    const compLinks = [...comp.querySelectorAll('.nav-sub a')].map((a) => a.getAttribute('href'));
    lines.push(`company.links=${compLinks.join(' | ')}`);

    // 8) Mobile menu contains Login + portal
    iframe.style.width = '390px';
    await new Promise((r) => setTimeout(r, 250));
    const mob = doc.getElementById('mobile-menu');
    const mobHrefs = [...mob.querySelectorAll('a')].map((a) => a.getAttribute('href'));
    lines.push(`mobile.items=${mob.querySelectorAll('a').length} mobile.loginCta=${mobHrefs.includes('https://licensing.skyhome.it/portal/login')} mobile.portal=${mobHrefs.some((h) => /portal\//.test(h))}`);

    // 9) Header overflow at 390px
    lines.push(`overflow390=${doc.documentElement.scrollWidth > doc.documentElement.clientWidth + 1}`);

    out.textContent = lines.join('\n');
    document.title = 'probe done';
  } catch (e) {
    out.textContent = 'ERROR: ' + e.message;
  }
};
iframe.src = '/docs/index.html';
</script>
</body>
</html>
